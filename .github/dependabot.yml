# Automatic update pull requests. Each PR runs the full CI before anyone merges it.
# PAUSED (owner's decision, 2026-10-26): the first push opened 17 untested upgrade PRs whose CI runs filled the private repo's queue and Actions minutes.
# `open-pull-requests-limit: 0` stops VERSION updates for each package manager (GitHub docs: "temporarily disable version updates ... by setting this option to zero").
# SECURITY update PRs are not affected by this limit and still arrive. To resume, set each limit back to a small number (for example 1) and upgrade one thing at a time.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      javascript-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
