name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the Deploy workflow runs this whole file first and deploys only if every job here is green

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (exact tested versions)
        run: pip install -r backend/requirements-dev.txt -c backend/requirements.lock
      - name: Backend tests
        run: bash scripts/test-backend.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  browser:
    # A real browser, a real backend (outside services replaced by captures) and a throwaway database: sign up, generate a notice, and scan pages for
    # accessibility problems (axe). The browser is downloaded here, in CI only.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.txt -c backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: yarn e2e
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python                  # the browser tests seed an operator account with scripts/e2e_seed_admin.py
          AUTHORITY_CHECK_ENABLED: "true"     # the Authority Check browser tests run against a server with the feature on
          DATE_LIST_ENABLED: "true"           # the list-of-dates browser tests likewise
          DEFECT_CHECK_ENABLED: "true"        # and the pre-filing defect check
          OLD_CODE_CHECK_ENABLED: "true"      # and the old-code checker
          DEADLINE_ENGINE_ENABLED: "true"     # and the deadline engine
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  security:
    # Secrets in the code or its history, and known vulnerabilities in what ships. A new finding fails the build; the scanner's
    # settings (and the few test-only values it is told to ignore) are in .gitleaks.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, checksum-verified download)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner --verbose -c .gitleaks.toml   # --verbose names the file, line and rule; --redact still hides every value
          ./gitleaks dir . --redact --no-banner --verbose -c .gitleaks.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend dependencies (pip-audit on the pinned versions)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Front-end dependencies that ship to browsers (yarn audit)
        working-directory: frontend
        run: yarn audit --groups dependencies

  images:
    # Proves both container images build (does not push anything).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t vidhi-backend .
      - run: docker build -f frontend/Dockerfile -t vidhi-web .

  stack:
    # The whole deployment on a throwaway machine: the .env is built by the real deploy/render_env.py from random secrets, the compose file and the HTTPS proxy file are validated, the
    # database, API and web containers start, the outside checks in deploy/smoke.sh pass, and an encrypted backup is made, read back and restored over the database, and the site is checked again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway environment
        run: bash deploy/ci-env.sh
      - name: Compose file and proxy file are valid
        run: |
          docker compose --profile https config -q
          docker run --rm -e DOMAIN=ci.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Start the stack
        run: docker compose up -d --build
      - name: Outside checks
        run: bash deploy/smoke.sh http://127.0.0.1:8080
      - name: Backup, read it back, restore it over the same database (as the app user, who may write only to its own database)
        run: |
          docker compose run --rm --no-deps -v "$PWD/secrets/backup_passphrase:/pp:ro" -v "$PWD/backups:/backups" --entrypoint python backend \
            tools/db_backup.py --out-dir /backups --passphrase-file /pp
          f="$(ls backups/vidhi-*.gpg | head -1)"
          docker compose run --rm --no-deps -v "$PWD/secrets/backup_passphrase:/pp:ro" -v "$PWD/backups:/backups" --entrypoint python backend \
            tools/db_restore.py "/backups/$(basename "$f")" --passphrase-file /pp --verify-only
          docker compose run --rm --no-deps -v "$PWD/secrets/backup_passphrase:/pp:ro" -v "$PWD/backups:/backups" --entrypoint python backend \
            tools/db_restore.py "/backups/$(basename "$f")" --passphrase-file /pp --replace --yes
          bash deploy/smoke.sh http://127.0.0.1:8080   # the site still works after the restore
      - name: Logs (only when something failed)
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up
        if: always()
        run: docker compose down -v
