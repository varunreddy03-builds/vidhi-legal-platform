# Security headers for everything nginx serves itself (the React app and its assets).
# The API sets its own headers in FastAPI, so /api/ does not include this file.
# NOTE: nginx drops inherited add_header lines inside any location that has its own add_header,
# so every static location includes this snippet explicitly.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Takes effect only over HTTPS (browsers ignore it on plain http) - TLS is terminated in front of this container.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The only outside origin allowed is Cloudflare's bot check (Turnstile), used on the signup page when TURNSTILE_SITE_KEY is set.
# The app is a self-contained bundle: its own scripts, its own fonts, inline styles (component libraries set
# style attributes), data: images (firm logos). Payments are a full-page redirect to Stripe, so no third-party
# script or frame is needed. Anything else is blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
