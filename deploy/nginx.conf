server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # No access log here: nginx's default writes the full address with its query string (search words, invitation codes). The proxy in front (Caddy) logs time, status and size only,
    # and the API logs the route template. Errors are still logged.
    access_log off;

    # The HTTPS proxy (Caddy) sits in front on the private compose network and sends the visitor's address in X-Forwarded-For. Trust that header ONLY when the connection comes from
    # a private address, so the API's rate limits and login throttling see each visitor instead of the proxy. A visitor on the internet cannot appear to be a private address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Evidence uploads go up to 50 MB (media); the API enforces the real per-type limits.
    client_max_body_size 55m;

    # Smaller downloads on slow mobile connections (the app and its API answers are text). Images, fonts and PDFs are
    # already compressed, so they are left alone.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # API -> backend container. The backend adds its own security headers.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: a client-supplied value must never reach the API
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;   # set by the HTTPS proxy
        proxy_read_timeout 180s;   # AI answers can take a while
        proxy_send_timeout 180s;
    }

    # Fingerprinted build assets never change: cache them hard.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: any other path serves index.html (never cached, so deploys show up at once).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
